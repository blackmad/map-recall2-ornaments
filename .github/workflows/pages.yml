name: Publish demo to gh-pages
on:
  push:
    branches: [main]
    paths: ['demo/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Push demo/ to the gh-pages branch
        run: |
          cd demo
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -qm "demo from ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
